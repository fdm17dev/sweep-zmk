# Applied on top of Sweep.conf, for the LEFT (central) half only.
#
# ZMK defines these two symbols inside `if ZMK_SPLIT_ROLE_CENTRAL`
# (app/src/split/bluetooth/Kconfig), so setting them in the shared
# Sweep.conf made the Sweep_right build emit
#   "... was assigned the value 'y' but got the value 'n'"
# on every CI run. Keeping them here keeps the peripheral build clean.
#
# Effect: the central fetches the peripheral's battery level and re-publishes
# it as a SECOND GATT Battery Service (0x180F) instance, so host-side tooling
# (scripts/check-battery.sh, zmk_status_daemon.py in the tech-docs repo) can
# read both halves over one BLE connection.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
