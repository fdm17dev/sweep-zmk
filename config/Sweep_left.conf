# Applied on top of Sweep.conf, for the LEFT (central) half only.
#
# ZMK defines these two symbols inside `if ZMK_SPLIT_ROLE_CENTRAL`
# (app/src/split/bluetooth/Kconfig), so setting them in the shared
# Sweep.conf made the Sweep_right build emit
#   "... was assigned the value 'y' but got the value 'n'"
# on every CI run. Keeping them here keeps the peripheral build clean.
#
# Effect: the central fetches the peripheral's battery level and re-publishes
# it as a SECOND GATT Battery Service (0x180F) instance, so host-side tooling
# (scripts/check-battery.sh, zmk_status_daemon.py in the tech-docs repo) can
# read both halves over one BLE connection.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# === Prospector status advertisement (telemetry) ===
# Broadcasts a 26-byte manufacturer-data packet over BLE advertisement carrying
# active layer + layer name, modifier flags, BLE profile slot, connection count,
# status flags (caps / charging / USB / BLE) and battery for both halves.
#
# Why advertisement and not a GATT characteristic: it is non-connectable and
# one-way, so it costs no BLE connection slot, needs no bonding, and stays
# readable even while the keyboard is talking to a DIFFERENT host - which is
# exactly the case a GATT-based reader is blind to.
#
# Central-only on purpose. ZMK_STATUS_ADVERTISEMENT only `depends on ZMK_BLE`,
# so putting it in the shared Sweep.conf would switch it on for Sweep_right too.
# Upstream says the peripheral then "just stays silent", but there is no reason
# to take that on trust when the central is the half that actually holds the
# layer, profile and proxied battery state.
CONFIG_ZMK_STATUS_ADVERTISEMENT=y

# MUST stay identical to CONFIG_ZMK_KEYBOARD_NAME in Sweep.conf. This option
# also OVERRIDES CONFIG_BT_DEVICE_NAME, so any other value renames the keyboard
# over BLE - which would break the existing pairing and every host-side tool
# that matches on the name (check-battery.sh, zmk_status_daemon.py --device).
CONFIG_ZMK_STATUS_ADV_KEYBOARD_NAME="SweepPlus"
# === end prospector ===
