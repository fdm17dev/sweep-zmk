#Enables the sleep management features
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_TIMEOUT=30000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=600000
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=1200

#EXT POWER
CONFIG_ZMK_EXT_POWER=y

# Mouse support
CONFIG_ZMK_POINTING=y

# Prevent ZMK Studio from modifying keymap (set to 'y' to lock keymap updates)
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_ZMK_KEYBOARD_NAME="SweepPlus"

# Bluetooth setup
# Left disabled: suspected cause of ~1-2s BLE disconnects on the right (peripheral) half
#CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
# Disabled again: re-enabling made right-half disconnects worse on this board
# (matches the pre-existing "//boots between 2" note - this hardware doesn't
# handle the +8dBm TX current draw cleanly, despite general ZMK guidance)
#CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
# Disable 2M PHY: more resilient to interference than the standard 1M PHY, at the cost of link speed
CONFIG_BT_CTLR_PHY_2M=n

# Uncomment these lines to add support for encoders
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y
#CONFIG_SENSOR_LOG_LEVEL_DBG=y

# enforce windows to show keyboard battery
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=y

# Turn on logging, and set ZMK logging to debug output
# WARNING: BATTERY INTENSIVE, TURN OFF WHEN NOT DEBUGGING
# CONFIG_ZMK_USB_LOGGING=y


# ===
# Configuration below to support 3th software
# can collect and show both paths battery status
CONFIG_BT_BAS=y
CONFIG_ZMK_BATTERY_REPORTING=y
# For split keyboards:
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
# === end config ===

